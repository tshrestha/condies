<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#a6b1e1" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b262c" />
        <title>Condies</title>
    </head>
    <body>
        <script>
            // Applies the theme before the first paint, so there's no flash of the wrong colors.
            ;(function () {
                var theme
                try {
                    theme = JSON.parse(localStorage.getItem("condiesTheme"))
                } catch (e) {}
                if (theme !== "light" && theme !== "dark") {
                    theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
                }
                document.documentElement.setAttribute("data-theme", theme)
                // Screens still on Bootstrap read these until they move to Strata Quiet.
                document.body.setAttribute("data-bs-theme", theme)
                document.body.classList.add(theme + "-bg")
            })()
        </script>
        <main id="root"></main>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
