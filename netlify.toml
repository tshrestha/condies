# Netlify serves the prerendered app from dist/client. @netlify/vite-plugin (vite.config.ts) deploys the server build
# as a Netlify Function on /*, behind the static files. It answers the app's server functions, and any page path, like
# /forecast/40,-105, with the same app shell. Netlify runs functions before redirects, so a rewrite to index.html here
# would never apply. Search needs these in the site's environment variables, scoped to Functions: mapbox_access_token,
# and db_address (host:port), db_username and db_password for the Redis that caches results and counts requests.
[build]
command = "npm run build"
publish = "dist/client"

[build.environment]
NODE_VERSION = "24"
